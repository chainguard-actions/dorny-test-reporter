name: Manual run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-dist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Create test report
        uses: ./
        if: ${{ !cancelled() }}
        with:
          name: JEST Tests
          path: __tests__/__results__/*.xml
          reporter: jest-junit
