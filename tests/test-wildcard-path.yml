name: Test wildcard path glob matching
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_STEP_SUMMARY: /tmp/step-summary.md
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up step summary file
        run: touch /tmp/step-summary.md

      - name: Copy multiple fixture test results
        run: |
          mkdir -p /tmp/test-results
          cp "$GITHUB_WORKSPACE/tests/fixtures/junit-passing.xml" /tmp/test-results/suite1.xml
          cp "$GITHUB_WORKSPACE/tests/fixtures/junit-with-skipped.xml" /tmp/test-results/suite2.xml

      - id: action
        uses: .
        continue-on-error: true
        with:
          name: "Wildcard Path Test Report"
          path: "/tmp/test-results/*.xml"
          reporter: java-junit
          fail-on-error: "false"
          fail-on-empty: "true"
          list-suites: "all"
          list-tests: "all"
          max-annotations: "0"
          use-actions-summary: "true"

      - name: Assert action ran and produced outputs or failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          PASSED: ${{ steps.action.outputs.passed }}
          FAILED: ${{ steps.action.outputs.failed }}
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          echo "passed: $PASSED"
          echo "failed: $FAILED"
          echo "skipped: $SKIPPED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CONCLUSION" ]; then
              echo "FAIL: action succeeded but conclusion output is empty"
              exit 1
            fi
            # Both fixtures have no failures, so conclusion should be 'success'
            if [ "$CONCLUSION" != "success" ]; then
              echo "FAIL: expected conclusion 'success' but got '$CONCLUSION'"
              exit 1
            fi
            # suite1 has 3 passed, suite2 has 3 passed + 1 skipped = 6 passed, 1 skipped total
            if [ "$PASSED" != "6" ]; then
              echo "FAIL: expected 6 passed tests (3+3) but got '$PASSED'"
              exit 1
            fi
            if [ "$SKIPPED" != "1" ]; then
              echo "FAIL: expected 1 skipped test but got '$SKIPPED'"
              exit 1
            fi
            echo "PASS: action succeeded with wildcard path, matched multiple files, passed=$PASSED, skipped=$SKIPPED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or environment issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
