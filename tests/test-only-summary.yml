name: Test only-summary mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_STEP_SUMMARY: /tmp/step-summary.md
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up step summary file
        run: touch /tmp/step-summary.md

      - name: Copy fixture test results
        run: |
          mkdir -p /tmp/test-results
          cp "$GITHUB_WORKSPACE/tests/fixtures/junit-passing.xml" /tmp/test-results/results.xml

      - id: action
        uses: .
        continue-on-error: true
        with:
          name: "Summary Only Test Report"
          path: "/tmp/test-results/results.xml"
          reporter: java-junit
          fail-on-error: "false"
          fail-on-empty: "true"
          only-summary: "true"
          list-suites: "none"
          list-tests: "none"
          max-annotations: "0"
          use-actions-summary: "true"

      - name: Assert action ran and produced outputs or failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          PASSED: ${{ steps.action.outputs.passed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          echo "passed: $PASSED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CONCLUSION" ]; then
              echo "FAIL: action succeeded but conclusion output is empty"
              exit 1
            fi
            if [ "$CONCLUSION" != "success" ]; then
              echo "FAIL: expected conclusion 'success' but got '$CONCLUSION'"
              exit 1
            fi
            if [ "$PASSED" != "3" ]; then
              echo "FAIL: expected 3 passed tests but got '$PASSED'"
              exit 1
            fi
            echo "PASS: action succeeded in only-summary mode with correct outputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or environment issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
