name: Test jest-junit reporter format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_STEP_SUMMARY: /tmp/step-summary.md
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up step summary file
        run: touch /tmp/step-summary.md

      - name: Copy jest-junit fixture test results
        run: |
          mkdir -p /tmp/test-results
          cp "$GITHUB_WORKSPACE/tests/fixtures/jest-junit-eslint.xml" /tmp/test-results/results.xml

      - id: action
        uses: .
        continue-on-error: true
        with:
          name: "Jest JUnit Test Report"
          path: "/tmp/test-results/results.xml"
          reporter: jest-junit
          fail-on-error: "false"
          fail-on-empty: "true"
          list-suites: "all"
          list-tests: "all"
          max-annotations: "0"
          use-actions-summary: "true"

      - name: Assert action ran and produced outputs or failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          PASSED: ${{ steps.action.outputs.passed }}
          FAILED: ${{ steps.action.outputs.failed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          echo "passed: $PASSED"
          echo "failed: $FAILED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CONCLUSION" ]; then
              echo "FAIL: action succeeded but conclusion output is empty"
              exit 1
            fi
            # jest-junit-eslint.xml has 1 test passing, no failures
            if [ "$CONCLUSION" != "success" ]; then
              echo "FAIL: expected conclusion 'success' but got '$CONCLUSION'"
              exit 1
            fi
            if [ "$PASSED" != "1" ]; then
              echo "FAIL: expected 1 passed test but got '$PASSED'"
              exit 1
            fi
            if [ "$FAILED" != "0" ]; then
              echo "FAIL: expected 0 failed tests but got '$FAILED'"
              exit 1
            fi
            echo "PASS: action succeeded with jest-junit reporter, conclusion='success', passed=1"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or environment issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
