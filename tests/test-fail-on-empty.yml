name: Test fail-on-empty with no matching files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_STEP_SUMMARY: /tmp/step-summary.md
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up step summary file
        run: touch /tmp/step-summary.md

      - id: action
        uses: .
        continue-on-error: true
        with:
          name: "Empty Test Report"
          path: "/tmp/nonexistent-path/no-results-*.xml"
          reporter: java-junit
          fail-on-error: "false"
          fail-on-empty: "true"
          list-suites: "all"
          list-tests: "all"
          max-annotations: "0"
          use-actions-summary: "true"

      - name: Assert action failed due to no test files found
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (no test files found with fail-on-empty=true)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when no test files found and fail-on-empty=true"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
