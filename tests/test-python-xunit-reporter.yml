name: Test python-xunit reporter format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_STEP_SUMMARY: /tmp/step-summary.md
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up step summary file
        run: touch /tmp/step-summary.md

      - name: Copy python xunit fixture test results
        run: |
          mkdir -p /tmp/test-results
          cp "$GITHUB_WORKSPACE/tests/fixtures/python-xunit-pytest.xml" /tmp/test-results/results.xml

      - id: action
        uses: .
        continue-on-error: true
        with:
          name: "Python xunit Test Report"
          path: "/tmp/test-results/results.xml"
          reporter: python-xunit
          fail-on-error: "false"
          fail-on-empty: "true"
          list-suites: "all"
          list-tests: "all"
          max-annotations: "0"
          use-actions-summary: "true"

      - name: Assert action ran and produced outputs or failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          PASSED: ${{ steps.action.outputs.passed }}
          FAILED: ${{ steps.action.outputs.failed }}
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          echo "passed: $PASSED"
          echo "failed: $FAILED"
          echo "skipped: $SKIPPED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CONCLUSION" ]; then
              echo "FAIL: action succeeded but conclusion output is empty"
              exit 1
            fi
            # The python-xunit fixture has failures so conclusion should be 'failure'
            if [ "$CONCLUSION" != "failure" ]; then
              echo "FAIL: expected conclusion 'failure' (fixture has failed tests) but got '$CONCLUSION'"
              exit 1
            fi
            if [ -z "$PASSED" ]; then
              echo "FAIL: passed output is empty"
              exit 1
            fi
            if [ -z "$FAILED" ]; then
              echo "FAIL: failed output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with python-xunit reporter, conclusion='failure', passed=$PASSED, failed=$FAILED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or environment issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
