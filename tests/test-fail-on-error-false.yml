name: Test fail-on-error false with failing tests
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_STEP_SUMMARY: /tmp/step-summary.md
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up step summary file
        run: touch /tmp/step-summary.md

      - name: Copy fixture test results with failures
        run: |
          mkdir -p /tmp/test-results
          cp "$GITHUB_WORKSPACE/tests/fixtures/junit-failing.xml" /tmp/test-results/results.xml

      - id: action
        uses: .
        continue-on-error: true
        with:
          name: "Fail-on-error-false Test Report"
          path: "/tmp/test-results/results.xml"
          reporter: java-junit
          fail-on-error: "false"
          fail-on-empty: "true"
          list-suites: "all"
          list-tests: "all"
          max-annotations: "0"
          use-actions-summary: "true"

      - name: Assert action ran and produced outputs or failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          PASSED: ${{ steps.action.outputs.passed }}
          FAILED: ${{ steps.action.outputs.failed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          echo "passed: $PASSED"
          echo "failed: $FAILED"
          if [ "$OUTCOME" = "success" ]; then
            # With fail-on-error=false, the step should succeed even with test failures
            if [ -z "$CONCLUSION" ]; then
              echo "FAIL: action succeeded but conclusion output is empty"
              exit 1
            fi
            # conclusion should be 'failure' (tests failed) but the step itself should not fail
            if [ "$CONCLUSION" != "failure" ]; then
              echo "FAIL: expected conclusion 'failure' (tests have failures) but got '$CONCLUSION'"
              exit 1
            fi
            if [ "$FAILED" != "1" ]; then
              echo "FAIL: expected 1 failed test but got '$FAILED'"
              exit 1
            fi
            echo "PASS: action succeeded with fail-on-error=false, conclusion='failure', failed=1"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or environment issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
